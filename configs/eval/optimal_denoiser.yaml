# Closed-form optimal denoiser baseline (no trained checkpoint needed).
meta:
  name: vfad
  global_seed: 0
  use_bfloat16: false
data:
  data_root: data/mvtec_ad
  dataset_name: mvtec_ad_all
  category: all
  test_batch_size: 4     # per-GPU batch size for evaluation
  num_workers: 8
  pin_memory: true
  persistent_workers: false
  img_size: 256
  transform_type: imagenet
model:
  backbone:
    model_name: efficientnet-b4
    normalization: null
    outblocks: [1, 5, 9, 21]
    outstrides: [2, 4, 8, 16]
    pretrained: true
logging:
  log_dir: logs/mvtec_optimal_denoiser/
  eval:
    steps: 1
    ablation_steps: [1, 2, 4, 8, 20, 40, 80, 200]   # default: [-1] disables the sweep
    inv_steps: 20
    recon_steps: 20
    stop_time: 0.8       # CondOT perturbation time t0 (smaller = more noise)
    solver_name: euler
    img_score_agg: diff+sum
    metrics: [img_auroc, img_ap, img_f1max, px_auroc, px_ap, px_f1max, px_aupro]
    save_dir: null
